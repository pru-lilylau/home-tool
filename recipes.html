<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港家常菜食譜 · Resep Rumahan Hong Kong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E7;
    --paper-2:#EFE7D6;
    --card:#FFFDF8;
    --ink:#1F3A3D;
    --ink-2:#3D5A5E;
    --stamp:#B23A2E;
    --stamp-2:#8E2E24;
    --sage:#7C8F79;
    --gold:#B8935A;
    --line:#D9CFB9;
    --shadow: 0 2px 10px rgba(31,58,61,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans TC',sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(31,58,61,0.05) 1px, transparent 0) 0 0/16px 16px,
      var(--paper);
    color:var(--ink);
    padding:24px 16px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header.top{
    border-bottom:3px double var(--ink);
    padding-bottom:14px;margin-bottom:16px;
  }
  header.top h1{
    font-family:'Noto Serif TC',serif;font-weight:900;font-size:26px;margin:0 0 4px;letter-spacing:1px;
  }
  header.top h1 .en{display:block;font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:.5px;margin-top:2px;}
  header.top .tagline{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin:8px 0 0;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:stretch;}
  .random-btn{
    background:linear-gradient(135deg,var(--stamp),var(--stamp-2));
    color:#fff;border:none;border-radius:10px;padding:12px 18px;cursor:pointer;
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px;
    line-height:1.3;transition:transform .1s ease;flex:0 0 auto;
  }
  .random-btn span{font-size:11px;font-weight:400;font-family:'Noto Sans TC',sans-serif;opacity:.92;}
  .random-btn:active{transform:scale(0.97);}
  #searchInput{
    flex:1;min-width:160px;border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;font-size:14px;background:var(--card);color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
  }
  #searchInput:focus{outline:2px solid var(--gold);}

  .cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .cat-tab{
    background:var(--paper-2);color:var(--ink-2);border:1px solid var(--line);
    border-radius:20px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;
    display:flex;align-items:center;gap:5px;transition:all .15s ease;
  }
  .cat-tab .id{font-size:10.5px;opacity:.75;}
  .cat-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
    display:flex;flex-direction:column;gap:6px;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(31,58,61,0.14);}
  .card .emoji{font-size:34px;line-height:1;}
  .card .zh-name{font-family:'Noto Serif TC',serif;font-weight:700;font-size:16px;color:var(--ink);}
  .card .id-name{font-size:12px;color:var(--ink-2);font-style:italic;}
  .card .badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
  .card .badge{
    font-size:10.5px;background:var(--paper-2);color:var(--ink-2);
    border-radius:20px;padding:3px 10px;
  }
  .card .badge.servings{background:rgba(124,143,121,0.18);color:var(--sage);}
  .empty-msg{grid-column:1/-1;text-align:center;color:var(--ink-2);padding:40px 0;font-size:14px;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(31,58,61,0.45);
    align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--card);border-radius:14px;max-width:620px;width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,0.25);position:relative;padding:26px 22px 30px;
    animation:pop .15s ease;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .close-btn{
    position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;
    color:var(--ink-2);cursor:pointer;line-height:1;
  }
  .modal .close-btn:hover{color:var(--stamp);}
  .modal-head{display:flex;align-items:center;gap:14px;border-bottom:2px double var(--line);padding-bottom:14px;margin-bottom:16px;}
  .modal-head .emoji{font-size:44px;}
  .modal-head .zh-name{font-family:'Noto Serif TC',serif;font-weight:900;font-size:21px;color:var(--ink);}
  .modal-head .id-name{font-size:13.5px;color:var(--ink-2);font-style:italic;margin-top:2px;}
  .modal-head .badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .modal-head .badge{font-size:10.5px;background:var(--paper-2);color:var(--ink-2);border-radius:20px;padding:3px 10px;}
  .modal-head .badge.servings{background:rgba(124,143,121,0.18);color:var(--sage);}
  .section-title{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:14.5px;color:var(--stamp);
    margin:18px 0 8px;letter-spacing:1px;display:flex;align-items:center;gap:6px;
  }
  .ing-table{width:100%;border-collapse:collapse;font-size:13px;}
  .ing-table tr{border-bottom:1px solid var(--line);}
  .ing-table tr:last-child{border-bottom:none;}
  .ing-table td{padding:6px 4px;vertical-align:top;}
  .ing-table td.name{width:56%;}
  .ing-table td.name .zh{font-weight:500;}
  .ing-table td.name .id{display:block;font-size:11.5px;color:var(--ink-2);font-style:italic;}
  .ing-table td.qty{text-align:right;color:var(--ink-2);font-size:12px;white-space:nowrap;}
  .ing-table td.qty .id{display:block;font-style:italic;opacity:.85;}

  .steps{list-style:none;margin:0;padding:0;counter-reset:step;}
  .steps li{
    counter-increment:step;padding:10px 0 10px 30px;position:relative;
    border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.6;
  }
  .steps li:last-child{border-bottom:none;}
  .steps li::before{
    content:counter(step);position:absolute;left:0;top:9px;
    width:20px;height:20px;border-radius:50%;background:var(--sage);color:#fff;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .steps li .id{display:block;color:var(--ink-2);font-style:italic;font-size:12.5px;margin-top:3px;}

  @media (max-width:480px){
    header.top h1{font-size:22px;}
    .random-btn{font-size:14px;padding:10px 14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>香港家常菜食譜<span class="en">Resep Masakan Rumahan Hong Kong</span></h1>
    <p class="tagline">
      中文同印尼文對照，方便揀餸同煮食，每道菜份量為4-5人食用 · 揀一味，今日就煮呢個！<br>
      Bahasa Kanton &amp; Indonesia berdampingan, setiap resep untuk porsi 4-5 orang · Pilih satu resep, masak ini hari ini!
    </p>
  </header>

  <div class="toolbar">
    <button id="randomBtn" class="random-btn">🎲 今日食乜？<span>Mau masak apa hari ini?</span></button>
    <input id="searchInput" type="text" placeholder="搜尋菜式名稱... / Cari nama resep...">
  </div>

  <div class="cat-tabs" id="catTabs"></div>

  <div class="grid" id="recipeGrid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

let currentCat = 'all';

function catInfo(key){ return CATEGORIES.find(c=>c.key===key); }

function renderCatTabs(){
  const el = document.getElementById('catTabs');
  el.innerHTML = CATEGORIES.map(c=>`
    <div class="cat-tab ${c.key===currentCat?'active':''}" data-cat="${c.key}">
      ${c.emoji} ${c.zh} <span class="id">${c.id}</span>
    </div>
  `).join('');
  el.querySelectorAll('.cat-tab').forEach(t=>{
    t.addEventListener('click', ()=>{ currentCat = t.dataset.cat; renderCatTabs(); renderGrid(); });
  });
}

function getFiltered(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return RECIPES.filter(r=>{
    const matchCat = currentCat==='all' || r.cat===currentCat;
    const matchQ = !q || r.zh.toLowerCase().includes(q) || r.id.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}

function renderGrid(){
  const list = getFiltered();
  const grid = document.getElementById('recipeGrid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty-msg">冇搵到相關菜式 · Tidak ditemukan resep yang cocok</div>`;
    return;
  }
  grid.innerHTML = list.map((r)=>{
    const idx = RECIPES.indexOf(r);
    const ci = catInfo(r.cat);
    return `
    <div class="card" data-idx="${idx}">
      <div class="emoji">${r.emoji}</div>
      <div class="zh-name">${r.zh}</div>
      <div class="id-name">${r.id}</div>
      <div class="badge-row">
        <div class="badge">${ci.zh} · ${ci.id}</div>
        <div class="badge servings">${SERVINGS.zh}</div>
      </div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> openModal(parseInt(c.dataset.idx)));
  });
}

function openModal(idx){
  const r = RECIPES[idx];
  const ci = catInfo(r.cat);
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <button class="close-btn" id="closeModalBtn">&times;</button>
    <div class="modal-head">
      <div class="emoji">${r.emoji}</div>
      <div>
        <div class="zh-name">${r.zh}</div>
        <div class="id-name">${r.id}</div>
        <div class="badge-row">
          <div class="badge">${ci.zh} · ${ci.id}</div>
          <div class="badge servings">${SERVINGS.zh} · ${SERVINGS.id}</div>
        </div>
      </div>
    </div>
    <div class="section-title">🧺 材料 · Bahan-bahan</div>
    <table class="ing-table">
      ${r.ing.map(([zh,id,qzh,qid])=>`
        <tr>
          <td class="name"><span class="zh">${zh}</span><span class="id">${id}</span></td>
          <td class="qty"><span class="zh">${qzh}</span><span class="id">${qid}</span></td>
        </tr>`).join('')}
    </table>
    <div class="section-title">🔥 做法 · Cara Memasak</div>
    <ol class="steps">
      ${r.steps.map(([zh,id])=>`<li>${zh}<span class="id">${id}</span></li>`).join('')}
    </ol>
  `;
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='modalOverlay') closeModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape') closeModal();
});

document.getElementById('searchInput').addEventListener('input', renderGrid);

document.getElementById('randomBtn').addEventListener('click', ()=>{
  const pool = getFiltered();
  const source = pool.length ? pool : RECIPES;
  const pick = source[Math.floor(Math.random()*source.length)];
  openModal(RECIPES.indexOf(pick));
});

renderCatTabs();
renderGrid();
</script>
</body>
</html>
